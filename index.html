<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR名刺</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; }
    #start-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 20px 40px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.75);
      color: #333;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      letter-spacing: 0.05em;
    }

    /* 丸型動画のスタイル */
    #circle-video {
      position: fixed;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }
  </style>
</head>
<body>

  <button id="start-button" style="display:none">タップしてARを開始</button>

  <a-scene mindar-image="imageTargetSrc: assets/targets.mind;"
           color-space="sRGB"
           renderer="colorManagement:true"
           vr-mode-ui="enabled:false"
           device-orientation-permission-ui="enabled:false">

    <a-assets>
      <video id="video"
             src="assets/videos/mako2.mp4"
             preload="auto"
             playsinline
             webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

   <a-entity mindar-image-target="targetIndex:0"
          id="card-target">
  <a-video id="ar-video"
           src="#video"
width="0.6"
height="0.6"
position="0 0 0.001"
geometry="primitive:circle; radius:0.3"
           material="src:#video; shader:flat"></a-video>
</a-entity>

  </a-scene>

  <script>
    const target = document.querySelector('#card-target');
    const video = document.querySelector('#video');
    const btn = document.querySelector('#start-button');

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      video.load();
    });

    target.addEventListener('targetFound', () => {
    video.muted = false;
    video.play();
    });


    target.addEventListener('targetLost', () => {
      video.pause();
      video.currentTime = 0;
    });
  </script>

</body>
</html>
